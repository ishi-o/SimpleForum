networks:
  forumx_network_dev:
    driver: bridge

volumes:
  mysql-data:
  nacos-data:
  redis-data:
  rocketmq-data:
  elasticsearch-data:
  minio-data:
  keycloak-data:

services:
  mysql:
    image: mysql:8.0.36
    container_name: forumx-mysql
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "3306:3306"
    environment:
      MYSQL_DEFAULT_CHARACTER_SET: utf8mb4
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: forumx
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.2.4
    container_name: forumx-redis
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/conf/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf --appendonly yes
    depends_on:
      mysql:
        condition: service_healthy

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: forumx-nacos
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - nacos-data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy

  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: forumx-elasticsearch
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./elasticsearch/plugins:/usr/share/elasticsearch/plugins
      - ./elasticsearch/ik-install.sh:/usr/local/bin/ik-install.sh
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command: >
      bash -c "
        /usr/local/bin/ik-install.sh &&
        /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper
      "

  rocketmq-namesrv:
    image: apache/rocketmq:5.1.4
    container_name: forumx-rocketmq-namesrv
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-data:/home/rocketmq/store
    command: sh mqnamesrv

  rocketmq-broker:
    image: apache/rocketmq:5.1.4
    container_name: forumx-rocketmq-broker
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - rocketmq-data:/home/rocketmq/store
      - ./rocketmq/conf/broker.conf:/home/rocketmq/conf/broker.conf
    command: sh mqbroker -c /home/rocketmq/conf/broker.conf
    depends_on:
      - rocketmq-namesrv

  minio:
    image: minio/minio:latest
    container_name: forumx-minio
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: forumx-keycloak
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "8080:8080"
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: localhost
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/realm:/opt/keycloak/data/import
    command: start-dev --import-realm
    depends_on:
      mysql:
        condition: service_healthy
