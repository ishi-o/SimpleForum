networks:
  forumx_network_dev:
    driver: bridge

volumes:
  mysql-data:
  nacos-data:
  redis-data:
  mysql-init:
  rabbitmq-data:
  minio-data:
  keycloak-data:

services:
  mysql:
    image: mysql:8.0.36
    container_name: forumx-mysql
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "3306:3306"
    environment:
      MYSQL_DEFAULT_CHARACTER_SET: utf8mb4
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.2.4
    container_name: forumx-redis
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/conf/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf --appendonly yes
    depends_on:
      mysql:
        condition: service_healthy

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: forumx-nacos
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
    volumes:
      - nacos-data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs

  seata-server:
    image: apache/seata-server:2.5.0
    container_name: seata-server
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      SEATA_REGISTRY_TYPE: nacos
      SEATA_REGISTRY_NACOS_SERVER_ADDR: forumx-nacos:8848
      SEATA_REGISTRY_NACOS_NAMESPACE: public
      SEATA_REGISTRY_NACOS_GROUP: SEATA_GROUP
      SEATA_REGISTRY_NACOS_SERVICE_NAME: seata-server
      SEATA_SERVICE_VGROUP_MAPPING: default_tx_group=default
      SEATA_CONFIG_TYPE: nacos
      SEATA_CONFIG_NACOS_SERVER_ADDR: forumx-nacos:8848
      SEATA_CONFIG_NACOS_GROUP: SEATA_GROUP
      SEATA_IP: 0.0.0.0
      SEATA_PORT: 8091
    depends_on:
      - nacos

  rabbitmq:
    image: rabbitmq:3.13.4-management-alpine
    container_name: forumx-rabbitmq
    restart: always
    hostname: rabbitmq
    networks:
      - forumx_network_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-forumx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-forumx}
      RABBITMQ_DEFAULT_VHOST: /forumx
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: forumx-minio
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: forumx-keycloak
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "8080:8080"
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-forumx@keycloakAdmin}

      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"

      KC_IMPORT: /opt/keycloak/data/import/realm.json

      SMS_PROVIDER: aliyun
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
      ALIYUN_SIGN_NAME: ${ALIYUN_SIGN_NAME}
      ALIYUN_TEMPLATE_CODE: ${ALIYUN_TEMPLATE_CODE}
      ALIYUN_REGION_ID: cn-hangzhou

      SMTP_HOST: smtpdm.aliyun.com
      SMTP_PORT: 465
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SSL: "true"

      KC_FEATURES: scripts,authorization

    command:
      - start-dev
      - --import-realm
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/plugins:/opt/keycloak/providers
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
