networks:
  forumx_network_dev:
    driver: bridge

volumes:
  mysql-data:
  nacos-data:
  redis-data:
  mysql-init:

services:
  mysql:
    image: mysql:8.0.36
    container_name: forumx-mysql
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "3306:3306"
    environment:
      MYSQL_DEFAULT_CHARACTER_SET: utf8mb4
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/conf:/etc/mysql/conf.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.2.4
    container_name: forumx-redis
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/conf/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf --appendonly yes
    depends_on:
      mysql:
        condition: service_healthy

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: forumx-nacos
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: false
    volumes:
      - nacos-data:/home/nacos/data
      - ./nacos/logs:/home/nacos/logs

  seata-server:
    image: apache/seata-server:2.5.0
    container_name: seata-server
    restart: always
    networks:
      - forumx_network_dev
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      - SEATA_REGISTRY_TYPE=nacos
      - SEATA_REGISTRY_NACOS_SERVER_ADDR=forumx-nacos:8848
      - SEATA_REGISTRY_NACOS_NAMESPACE=public
      - SEATA_REGISTRY_NACOS_GROUP=SEATA_GROUP
      - SEATA_REGISTRY_NACOS_SERVICE_NAME=seata-server
      - SEATA_SERVICE_VGROUP_MAPPING=default_tx_group=default
      - SEATA_CONFIG_TYPE=nacos
      - SEATA_CONFIG_NACOS_SERVER_ADDR=forumx-nacos:8848
      - SEATA_CONFIG_NACOS_GROUP=SEATA_GROUP
      - SEATA_IP=0.0.0.0
      - SEATA_PORT=8091
    depends_on:
      - nacos
