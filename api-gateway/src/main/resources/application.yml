server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
        namespace: public

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1

        - id: post-service
          uri: lb://content-service
          predicates:
            - Path=/api/contents/**
          filters:
            - StripPrefix=1

      default-filters:
        - AddRequestHeader=X-Request-Gateway, gateway-service
