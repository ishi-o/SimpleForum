spring:
  config:
    import: optional:nacos:${spring.application.name}.${file-extension:yaml}

  application:
    name: user-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
        namespace: public

server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
    encoding:
      charset: UTF-8
      force: true

logging:
  level:
    root: INFO
  file:
    name: ../logs/user-service-dev.log
