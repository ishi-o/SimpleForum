spring:
  application:
    name: content-service

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
        namespace: public

  datasource:
    url: jdbc:mysql://localhost:3306/content_db?useSSL=false&serverTimezone=UTC
    username: content_service
    password: C0nt3ntSrv@2025!db
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  servlet:
    encoding:
      charset: UTF-8
      force: true

  messages:
    encoding: UTF-8
    basename: i18n/messages

server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

logging:
  level:
    root: INFO
  file:
    name: ../logs/content-service-dev.log
